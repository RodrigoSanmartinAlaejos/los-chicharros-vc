components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de 15 minutos, en la cabecera `Authorization`
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: '`HttpOnly`, `Secure`, `SameSite=Strict`, `Path=/api/v1/auth`'
  headers:
    RefreshCookie:
      description: Refresh token nuevo
      schema:
        type: string
      example: refresh_token=…; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: Campo y dirección
      schema:
        type: string
      example: publishedAt,desc
  responses:
    BadRequest:
      description: Datos o filtros no válidos; `errors` detalla cada campo
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Sin sesión, token caducado o credenciales incorrectas
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Sin permiso para esta acción
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: No existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Duplicado o con registros que dependen de él
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    PayloadTooLarge:
      description: Fichero de más de 5 MB
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: 'Demasiadas peticiones: más de 20 por minuto en `/auth/**`'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      type: object
      description: Error RFC 7807 (`application/problem+json`).
      required:
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          description: Solo en errores de validación
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    PageMeta:
      type: object
      required:
      - page
      - size
      - totalElements
      - totalPages
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    AccessTokenResponse:
      type: object
      required:
      - accessToken
      - expiresIn
      properties:
        accessToken:
          type: string
          description: JWT; se guarda solo en memoria
        expiresIn:
          type: integer
          description: Segundos de validez
          example: 900
    NewsType:
      type: string
      enum:
      - MATCH_REPORT
      - EVENT
      - STATEMENT
      description: Crónica, evento o comunicado
    NewsSummary:
      type: object
      required:
      - id
      - title
      - slug
      - summary
      - type
      - featured
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        title:
          type: string
        slug:
          type: string
        summary:
          type: string
        type:
          $ref: '#/components/schemas/NewsType'
        imageUrl:
          type:
          - string
          - 'null'
          format: uri
        featured:
          type: boolean
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
    NewsSummaryPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - content
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/NewsSummary'
    NewsResponse:
      allOf:
      - $ref: '#/components/schemas/NewsSummary'
      - type: object
        required:
        - contentHtml
        properties:
          contentHtml:
            type: string
            description: Cuerpo en HTML saneado
          contentMarkdown:
            type: string
            description: Solo para el administrador
    NewsRequest:
      type: object
      required:
      - title
      - summary
      - content
      - type
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
        summary:
          type: string
          minLength: 1
          maxLength: 300
        content:
          type: string
          minLength: 1
          description: Markdown
        type:
          $ref: '#/components/schemas/NewsType'
        featured:
          type: boolean
          default: false
    NewsPatchRequest:
      type: object
      description: Solo se cambian los campos enviados.
      properties:
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
        featured:
          type: boolean
    SeasonRequest:
      type: object
      required:
      - name
      - startDate
      - endDate
      properties:
        name:
          type: string
          pattern: ^\d{4}-\d{2}$
          example: 2026-27
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        active:
          type: boolean
          default: false
    SeasonResponse:
      allOf:
      - type: object
        required:
        - id
        properties:
          id:
            type: integer
            format: int64
            readOnly: true
      - $ref: '#/components/schemas/SeasonRequest'
    Gender:
      type: string
      enum:
      - MALE
      - FEMALE
      - MIXED
    CategoryRequest:
      type: object
      required:
      - name
      - gender
      - sortOrder
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          example: Cadete
        gender:
          $ref: '#/components/schemas/Gender'
        sortOrder:
          type: integer
          minimum: 0
    CategoryResponse:
      allOf:
      - type: object
        required:
        - id
        properties:
          id:
            type: integer
            format: int64
            readOnly: true
      - $ref: '#/components/schemas/CategoryRequest'
    VenueRequest:
      type: object
      required:
      - name
      - address
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 200
        latitude:
          type:
          - number
          - 'null'
          minimum: -90
          maximum: 90
        longitude:
          type:
          - number
          - 'null'
          minimum: -180
          maximum: 180
    VenueResponse:
      allOf:
      - type: object
        required:
        - id
        properties:
          id:
            type: integer
            format: int64
            readOnly: true
      - $ref: '#/components/schemas/VenueRequest'
    PersonRequest:
      type: object
      required:
      - firstName
      - lastName
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 60
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type:
          - string
          - 'null'
          format: date
        imageConsent:
          type: boolean
          default: false
    PersonResponse:
      allOf:
      - type: object
        required:
        - id
        properties:
          id:
            type: integer
            format: int64
            readOnly: true
          photoUrl:
            type:
            - string
            - 'null'
            format: uri
      - $ref: '#/components/schemas/PersonRequest'
      description: Datos completos; solo para el administrador.
    PersonPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - content
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/PersonResponse'
    PublicPerson:
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        displayName:
          type: string
          description: Nombre e inicial del apellido
          example: Lucía M.
        photoUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Nulo si no hay foto o no hay consentimiento de imagen
    MembershipType:
      type: string
      enum:
      - PLAYER
      - COACH
    MembershipRequest:
      type: object
      required:
      - personId
      - type
      properties:
        personId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/MembershipType'
        shirtNumber:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 99
        position:
          type:
          - string
          - 'null'
          maxLength: 30
    MembershipPatchRequest:
      type: object
      properties:
        shirtNumber:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 99
        position:
          type:
          - string
          - 'null'
          maxLength: 30
    MembershipResponse:
      type: object
      required:
      - id
      - person
      - type
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        person:
          $ref: '#/components/schemas/PublicPerson'
        type:
          $ref: '#/components/schemas/MembershipType'
        shirtNumber:
          type:
          - integer
          - 'null'
        position:
          type:
          - string
          - 'null'
    TeamSummary:
      type: object
      required:
      - id
      - name
      - ownClub
      - category
      - seasonId
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
        ownClub:
          type: boolean
        crestUrl:
          type:
          - string
          - 'null'
          format: uri
        category:
          $ref: '#/components/schemas/CategoryResponse'
        seasonId:
          type: integer
          format: int64
    TeamResponse:
      allOf:
      - $ref: '#/components/schemas/TeamSummary'
      - type: object
        required:
        - players
        - coaches
        properties:
          players:
            type: array
            items:
              $ref: '#/components/schemas/MembershipResponse'
          coaches:
            type: array
            items:
              $ref: '#/components/schemas/MembershipResponse'
    TeamRequest:
      type: object
      required:
      - seasonId
      - categoryId
      - name
      properties:
        seasonId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        ownClub:
          type: boolean
          default: false
    CompetitionRequest:
      type: object
      required:
      - seasonId
      - categoryId
      - name
      properties:
        seasonId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
        federation:
          type:
          - string
          - 'null'
          maxLength: 100
        forfeitPenaltyPoints:
          type: integer
          minimum: 0
          maximum: 10
          default: 1
    CompetitionResponse:
      allOf:
      - type: object
        required:
        - id
        properties:
          id:
            type: integer
            format: int64
            readOnly: true
      - $ref: '#/components/schemas/CompetitionRequest'
    StandingRequest:
      type: object
      required:
      - teamId
      - points
      - played
      - won
      - lost
      - setsWon
      - setsLost
      - penaltyPoints
      properties:
        teamId:
          type: integer
          format: int64
        points:
          type: integer
        played:
          type: integer
          minimum: 0
        won:
          type: integer
          minimum: 0
        lost:
          type: integer
          minimum: 0
        setsWon:
          type: integer
          minimum: 0
        setsLost:
          type: integer
          minimum: 0
        penaltyPoints:
          type: integer
          minimum: 0
    StandingResponse:
      type: object
      required:
      - position
      - team
      - points
      - played
      - won
      - lost
      - setsWon
      - setsLost
      - penaltyPoints
      properties:
        position:
          type: integer
          minimum: 1
        team:
          $ref: '#/components/schemas/TeamSummary'
        points:
          type: integer
        played:
          type: integer
        won:
          type: integer
        lost:
          type: integer
        setsWon:
          type: integer
        setsLost:
          type: integer
        penaltyPoints:
          type: integer
    MatchdayRequest:
      type: object
      required:
      - competitionId
      - number
      properties:
        competitionId:
          type: integer
          format: int64
        number:
          type: integer
          minimum: 1
        scheduledDate:
          type:
          - string
          - 'null'
          format: date
    MatchdayResponse:
      allOf:
      - type: object
        required:
        - id
        properties:
          id:
            type: integer
            format: int64
            readOnly: true
          matches:
            type: array
            items:
              $ref: '#/components/schemas/MatchResponse'
      - $ref: '#/components/schemas/MatchdayRequest'
    MatchStatus:
      type: string
      enum:
      - SCHEDULED
      - IN_PROGRESS
      - FINISHED
      - POSTPONED
      - CANCELLED
      - FORFEITED
      description: '`FORFEITED` se usa desde la fase 3'
    MatchRequest:
      type: object
      required:
      - matchdayId
      - homeTeamId
      - awayTeamId
      - startsAt
      properties:
        matchdayId:
          type: integer
          format: int64
        homeTeamId:
          type: integer
          format: int64
        awayTeamId:
          type: integer
          format: int64
          description: Distinto del local
        venueId:
          type:
          - integer
          - 'null'
          format: int64
        startsAt:
          type: string
          format: date-time
          example: '2026-11-14T17:30:00Z'
    MatchPatchRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/MatchStatus'
        homeSets:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 3
        awaySets:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 3
        startsAt:
          type: string
          format: date-time
    MatchResponse:
      type: object
      required:
      - id
      - matchdayId
      - competitionId
      - homeTeam
      - awayTeam
      - startsAt
      - status
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        matchdayId:
          type: integer
          format: int64
        matchdayNumber:
          type: integer
        competitionId:
          type: integer
          format: int64
        homeTeam:
          $ref: '#/components/schemas/TeamSummary'
        awayTeam:
          $ref: '#/components/schemas/TeamSummary'
        venue:
          oneOf:
          - $ref: '#/components/schemas/VenueResponse'
          - type: 'null'
        startsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/MatchStatus'
        homeSets:
          type:
          - integer
          - 'null'
        awaySets:
          type:
          - integer
          - 'null'
    MatchPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - content
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/MatchResponse'

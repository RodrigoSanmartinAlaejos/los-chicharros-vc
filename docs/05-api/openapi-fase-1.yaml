# Contrato OpenAPI de la fase 1. Se genera la documentación interactiva en /swagger-ui.
openapi: 3.1.0
info:
  title: API de Los Chicharros V.C. (fase 1)
  version: 0.1.0
  description: 'Contrato de la API REST de la fase 1 (MVP público). Rutas en inglés y bajo `/api/v1`, JSON en `camelCase`,
    fechas en ISO 8601 y errores RFC 7807. Las convenciones están en `docs/05-api/README.md` y los permisos en `docs/02-requisitos/matriz-permisos.md`.
    En la fase 1 solo existe el administrador: toda operación con `bearerAuth` exige ese rol.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: /api/v1
  description: 'Relativa al frontend: el navegador siempre llama a través del proxy del SSR'
tags:
- name: Autenticación
- name: Noticias
- name: Equipos
- name: Personas
- name: Competiciones
- name: Partidos
- name: Configuración
security: []
paths:
  /auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: Devuelve un access token de 15 minutos y pone el refresh token en una cookie `HttpOnly`. Tras
        5 fallos seguidos para un email desde una IP, esa combinación se bloquea 15 minutos; el error es siempre
        el mismo 401 genérico.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags:
      - Autenticación
      summary: Renovar el access token
      description: Usa el refresh token de la cookie, lo rota y devuelve uno nuevo. Si llega uno ya usado, se revocan
        todas las sesiones del usuario. La sesión termina tras 2 horas sin renovar o 7 días después del login.
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Token renovado
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags:
      - Autenticación
      summary: Cerrar sesión
      description: Revoca el refresh token y borra la cookie.
      security:
      - refreshCookie: []
      responses:
        '204':
          description: Sin contenido
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /news:
    get:
      tags:
      - Noticias
      summary: Listar noticias
      description: Sin sesión devuelve solo las publicadas, de la más reciente a la más antigua. `status=draft`
        (solo administrador) devuelve los borradores.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/NewsType'
      - name: featured
        in: query
        schema:
          type: boolean
      - name: status
        in: query
        schema:
          type: string
          enum:
          - published
          - draft
          default: published
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Noticias
      summary: Crear una noticia
      description: Se crea como borrador (sin `publishedAt`). El slug se genera a partir del título.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsRequest'
      responses:
        '201':
          description: Creado
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /news/by-slug/{slug}:
    get:
      tags:
      - Noticias
      summary: Obtener una noticia publicada por su slug
      description: El cuerpo llega en HTML ya saneado en el backend. Un borrador devuelve 404.
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
          maxLength: 170
        example: victoria-cadete-femenino-ante-alisios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /news/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Noticias
      summary: Obtener una noticia por id (panel)
      description: Incluye borradores y el cuerpo en Markdown.
      security:

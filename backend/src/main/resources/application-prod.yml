# Producción (TiDB Cloud Starter). Las migraciones las ejecuta GitHub Actions antes del despliegue.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    clean-disabled: true

logging:
  level:
    root: warn

# Swagger solo de lectura en producción: se ve la documentación, pero sin botón «Try it out»
springdoc:
  swagger-ui:
    supported-submit-methods: []

# Imágenes en Cloudinary: el disco de Render se borra en cada despliegue
app:
  images:
    storage: ${IMAGE_STORAGE:cloudinary}
    cloudinary-folder: los-chicharros/prod

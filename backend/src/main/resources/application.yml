spring:
  application:
    name: api
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  # Imágenes de 5 MB como máximo (docs/05-api/README.md); el proxy del SSR usa el mismo total
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Mensajes de validación en español sea cual sea el idioma del navegador
  web:
    locale: es
    locale-resolver: fixed
  # Paginación (docs/05-api/README.md): 20 por defecto y 100 como máximo; ?page empieza en 0
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Las fechas con hora se guardan en UTC (diccionario de datos)
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

# Actuator: solo /actuator/health, de lectura y sin detalles (reglas técnicas, «Configuración»).
# Lo consultan el monitor de caídas y el SSR al arrancar, para despertar la API.
server:
  # IP real del cliente: X-Forwarded-For solo se acepta si llega de un proxy de red interna, como el
  # servidor SSR (ADR-004)
  forward-headers-strategy: native
app:
  # Access tokens firmados con JWT_SECRET (al menos 32 caracteres) y válidos 15 minutos
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    issuer: los-chicharros-api
  # Sesión: cada renovación la alarga 2 horas, hasta 7 días desde el login
  session:
    refresh-token-ttl: 2h
    max-duration: 7d
    cookie-secure: true
  # Fuerza bruta en el login: 5 fallos seguidos por email + IP bloquean 15 minutos, y cada IP tiene
  # como mucho 20 peticiones por minuto en /api/v1/auth/** (reglas técnicas, regla 5 de autenticación)
  login-protection:
    max-failures: 5
    block-duration: 15m
    requests-per-minute: 20
  # Administrador inicial: se crea al arrancar si no hay ninguno
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # Imágenes (H14): en disco en dev (carpeta backend/uploads, servida en /api/images/**) y en
  # Cloudinary en staging y prod, cada entorno en su carpeta (reglas técnicas, regla 13 de Java)
  images:
    storage: ${IMAGE_STORAGE:local}
    local-directory: ${IMAGE_DIR:uploads}
    cloudinary-url: ${CLOUDINARY_URL:}
    cloudinary-folder: los-chicharros/dev

# Documentación de la API (T08): /swagger-ui y /v3/api-docs, solo con las rutas de /api/v1. Las
# respuestas de error salen de la convención de la API (OpenApiConfig), no de ApiExceptionHandler
springdoc:
  paths-to-match: /api/v1/**
  override-with-generic-response: false
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
      # Sin la página /actuator que lista los endpoints
      discovery:
        enabled: false
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      # Sin grupos liveness y readiness: no hay Kubernetes, y así la respuesta es solo {"status":"UP"}
      probes:
        enabled: false

# Desarrollo local contra el MySQL de docker-compose.yml.
# Las credenciales se leen del .env de la raíz del repositorio (no se sube a Git).
spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    clean-disabled: false

logging:
  level:
    com.loschicharros: debug

name: Bug
description: Algo no funciona como debería.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options: [dev (local), staging, prod]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs o capturas
      description: Sin datos personales, contraseñas ni tokens.

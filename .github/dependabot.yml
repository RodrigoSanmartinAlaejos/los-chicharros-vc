# Dependabot propone actualizaciones semanales; cada una llega como PR a develop y pasa la CI.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: npm # cubre pnpm: lee pnpm-lock.yaml
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
    ignore:
      # Los tipos de Node siguen la versión de .nvmrc (24); solo se aceptan menores y parches
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm # Husky y lint-staged de la raíz
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    ignore:
      # MySQL se queda en 8.4 LTS (reglas técnicas); solo se aceptan parches dentro de 8.4
      - dependency-name: mysql
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

# Dependabot propone actualizaciones semanales; cada una llega como PR a develop y pasa la CI.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: npm # cubre pnpm: lee pnpm-lock.yaml
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

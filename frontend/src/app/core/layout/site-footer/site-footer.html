<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__copy">© {{ year }} Los Chicharros V.C.</p>
    <nav aria-label="Información legal">
      <ul class="site-footer__list">
        @for (item of legalItems; track item.path) {
          <li>
            <a class="site-footer__link" [routerLink]="item.path">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>
  </div>
</footer>

<main id="contenido" class="login" tabindex="-1">
  <img class="login__crest" src="escudo.svg" alt="" width="80" height="96" />
  <h1 class="login__title">Panel de gestión</h1>
  <p class="login__subtitle">Acceso solo para el club</p>

  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="username"
        aria-describedby="login-email-error"
        [attr.aria-invalid]="fieldError('email') ? 'true' : null"
      />
      <p id="login-email-error" class="field__error">{{ fieldError('email') }}</p>
    </div>
    <div class="field">
      <label for="login-password">Contraseña</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        aria-describedby="login-password-error"
        [attr.aria-invalid]="fieldError('password') ? 'true' : null"
      />
      <p id="login-password-error" class="field__error">{{ fieldError('password') }}</p>
    </div>

    <p class="login__error" role="alert">{{ error() }}</p>

    <button type="submit" class="button button--primary login__submit" [disabled]="submitting()">
      {{ submitting() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <a class="login__back" routerLink="/">← Volver a la web</a>
</main>
